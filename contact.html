<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082a20">
  <title>Contact - Rspl Tournament</title>
  <link rel="icon" href="https://i.ibb.co.com/m5tmZ4PT/Messenger-creation-7-D3924-FC-F023-47-C5-844-F-A91970795523.jpg">
  <link rel="stylesheet" href="style.css">
  <style>
    fieldset { border: none; display: grid; gap: 10px; }
    legend { font-weight: 600; margin-bottom: 8px; }
    .choices { display: flex; gap: 12px; }
    .choice {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--court-dark);
      font-weight: 600;
      cursor: pointer;
    }
    .choice input {
      width: 20px;
      height: 20px;
      padding: 0;
      accent-color: var(--shuttle);
    }
    .choice:has(input:checked) {
      border-color: var(--shuttle);
      color: var(--shuttle);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand">
      RspL Tournament
      <img src="https://i.ibb.co.com/m5tmZ4PT/Messenger-creation-7-D3924-FC-F023-47-C5-844-F-A91970795523.jpg" alt="RspL logo">
    </h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Event</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contact</h2>
    <p class="sub">Send a message to the organizers.</p>

    <form id="contactForm">
      <label>Your name
        <input type="text" id="name" name="name" autocomplete="name" required>
      </label>

      <label>Location 
        <input type="text" id="location" name="location" required>
      </label>

      <label>Phone number
        <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required>
      </label>

      <fieldset>
        <legend>Match type</legend>
        <div class="choices">
          <label class="choice">
            <input type="radio" name="matchType" value="Single" required> Single
          </label>
          <label class="choice">
            <input type="radio" name="matchType" value="Double"> Double
          </label>
        </div>
      </fieldset>

      <label>Message
        <textarea id="message" name="message" required></textarea>
      </label>

      <button class="btn" type="submit">Send on WhatsApp</button>
      <p class="note">Your message opens in WhatsApp, ready to send.</p>
    </form>
  </main>

  <footer>&copy; RspL Tournament</footer>

  <script>
    const WHATSAPP_NUMBER = "6584029857";

    document.getElementById("contactForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      const name = document.getElementById("name").value.trim();
      const location = document.getElementById("location").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const matchType = document.querySelector('input[name="matchType"]:checked').value;
      const message = document.getElementById("message").value.trim();
      const text =
        "RspL Tournament\n" +
        "Name: " + name + "\n" +
        "Location: " + location + "\n" +
        "Phone: " + phone + "\n" +
        "Match type: " + matchType + "\n" +
        "Message: " + message;
      window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text), "_blank");
    });
  </script>

</body>
</html>
